<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>医学教育 生成AIコンテンツ工房 | MedEd GenAI Content Studio</title>
  <meta name="description" content="Six evidence-informed generative-AI resources for health professions education (simulated patient, formative MCQs, scoring rubric, scaffolding tutor, AI-use rules, AI-free assessment). Japanese, English, Korean and Chinese.">
  <link rel="license" href="https://creativecommons.org/licenses/by/4.0/">
  <link rel="alternate" hreflang="ja" href="?lang=ja">
  <link rel="alternate" hreflang="en" href="?lang=en">
  <link rel="alternate" hreflang="ko" href="?lang=ko">
  <link rel="alternate" hreflang="zh-Hans" href="?lang=zh">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">✚</span>
      <div>
        <div class="brand-title" id="brand-title">医学教育 生成AIコンテンツ工房</div>
        <div class="brand-sub" id="brand-sub"></div>
      </div>
    </div>
    <div class="top-actions">
      <div id="lang-switch" class="lang-switch" role="group"></div>
      <button id="btn-settings" class="btn ghost" type="button">⚙ <span id="btn-settings-label">設定</span> <span id="provider-badge" class="badge"></span></button>
    </div>
  </header>

  <div class="layout">
    <nav id="nav" class="nav" aria-label="menu"></nav>
    <main id="main" class="main" tabindex="-1"></main>
  </div>

  <dialog id="dlg-settings" class="dialog">
    <form method="dialog" id="settings-form">
      <h2 id="set-h">設定</h2>
      <label id="lbl-provider">AI<select id="set-provider"></select></label>
      <label id="lbl-model">Model<input id="set-model" type="text" autocomplete="off"><small id="set-model-help"></small></label>
      <label id="lbl-key">API key<input id="set-key" type="password" autocomplete="off"><small id="key-link"></small></label>
      <label class="check"><input id="set-remember" type="checkbox"> <span id="set-remember-label"></span></label>
      <div class="notice" id="set-notice"></div>
      <div class="dialog-actions">
        <button class="btn primary" value="save" type="submit" id="btn-save">保存</button>
        <button class="btn ghost" value="cancel" type="submit" id="btn-close">閉じる</button>
      </div>
    </form>
  </dialog>

  <footer class="footer" id="footer"></footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
